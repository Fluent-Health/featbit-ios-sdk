name: FeatBitExampleApp
options:
  bundleIdPrefix: com.fluentinhealth
  deploymentTarget:
    iOS: "14.0"
packages:
  featbit-ios-sdk:
    path: ../..
targets:
  FeatBitExampleApp:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: featbit-ios-sdk
        product: FeatBitClient
      - package: featbit-ios-sdk
        product: FeatBitSwiftUI
      - package: featbit-ios-sdk
        product: FeatBitLifecycle
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: FeatBit Example
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"
        SWIFT_VERSION: "5.9"
